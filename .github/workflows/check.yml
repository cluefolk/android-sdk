name: Android SDK checks
on: [push, pull_request]
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: {distribution: temurin, java-version: '21'}
      # The runner has the Android SDK; add the platform the SDK compiles against.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' > /dev/null
      - run: ./gradlew :sdk:assembleRelease :sdk:lintRelease :sdk:testDebugUnitTest
